<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        document.write("<h1>Operators in JavaScript</h1>");

        // Arithmetic Operators
        document.write("<h2>Arithmetic Operators</h2>");
        var a = 5;
        var b = 10;
        document.write(" Addition       : a + b = " + (a + b) + "<br/>");
        document.write(" Subtraction    : a - b = " + (a - b) + "<br/>");
        document.write(" Multiplication : a * b = " + (a * b) + "<br/>");
        document.write(" Division       : a / b = " + (a / b) + "<br/>");
        document.write(" Modulus        : a % b = " + (a % b) + "<br/>");

        //relational operators
        document.write("<h2>Relational Operators</h2>");
        var a = 5;
        var b = 5;
        document.write(" Greater Than             : a > b = " + (a > b) + "<br/>");
        document.write(" Less Than                : a < b = " + (a < b) + "<br/>");
        document.write(" Greater Than or Equal To : a >= b = " + (a >= b) + "<br/>");
        document.write(" Less Than or Equal To    : a <= b = " + (a <= b) + "<br/>");
        document.write(" Equal                    : a == b = " + (a == b) + "<br/>");
        document.write(" Not Equal                : a != b = " + (a != b) + "<br/>");
        document.write(" Strict Equal             : a === b = " + (a === b) + "<br/>");

        //logical operators
        document.write("<h2>Logical Operators</h2>");
        var x = true;
        var y = false;
        document.write(" AND : x && y = " + (x && y) + "<br/>");
        document.write(" OR  : x || y = " + (x || y) + "<br/>");
        document.write(" NOT : !x = " + (!x) + "<br/>");

        // Assignment operators
        document.write("<h2>Assignment Operators</h2>");
        var a = 5;
        document.write("Assignment a = 5 : " + a + "<br/>");
        a += 10; // a = a + 10
        document.write("Add & Assign a += 10 : " + a + "<br/>");
        a -= 5; // a = a - 5
        document.write("Subtract & Assign a -= 5 : " + a + "<br/>");
        a *= 2; // a = a * 2
        document.write("Multiply & Assign a *= 2 : " + a + "<br/>");
        a /= 2; // a = a / 2
        document.write("Divide & Assign a /= 2 : " + a + "<br/>");
        a %= 3; // a = a % 3
        document.write("Modulus & Assign a %= 3 : " + a + "<br/>");
        a **= 2; // a = a ** 2
        document.write("Exponent & Assign a **= 2 : " + a + "<br/>");

        //Bitwise Operators
        document.write("<h2>Bitwise Operators</h2>");
        var a = 5;
        var b = 3;
        document.write(" AND         : a & b = " + (a & b) + "<br/>");
        document.write(" OR          : a | b = " + (a | b) + "<br/>");
        document.write(" XOR         : a ^ b = " + (a ^ b) + "<br/>");
        document.write(" NOT         : ~a = " + (~a) + "<br/>");
        document.write(" Left Shift  : a << 1 = " + (a << 1) + "<br/>");
        document.write(" Right Shift : a >> 1 = " + (a >> 1) + "<br/>");



        //unary operators
        document.write("<h1>Unary Operater</h1>");
        var x = 5;
        document.write("before x :" + x + "<br/>");
        x++;
        document.write("after x : " + x + "<br/>");
        x--;
        document.write("after decrement x : " + x + "<br/>")

        var a = 5;
        document.write("<h1>postincrement</h1>");
        document.write(a++ + "<br/>");
        document.write(a);

        var a = 5;
        document.write("<h1>preincrement</h1>");
        document.write(++a + "<br/>");
        document.write(a);

        var a=5;
        document.write("<h1>postdecrement</h1>");
        document.write(a-- + "<br/>");
        document.write(a);

        var a=5;
        document.write("<h1>predecrement</h1>");
        document.write(--a + "<br/>");
        document.write(a);

        
    </script>
</body>

</html>
